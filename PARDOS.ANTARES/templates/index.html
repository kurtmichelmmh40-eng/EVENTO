<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>EVENTO ANTARES</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --naranja:#FF7B25;
      --fondo:#F5F5F5;
      --tarjeta:#FFFFFF;
      --texto:#222;
      --sub:#555;
      --success:#2ECC71;
      --danger:#E74C3C;
      --azul:#3498db;
    }
    html,body{
      height:100%;
      margin:0;
      font-family:'Inter',sans-serif;
      background:var(--fondo);
      color:var(--texto);
      display:flex;
      flex-direction:column;
      align-items:center;
      position:relative;
    }
    body::before{
      content:"";
      position:fixed;
      inset:0;
      background:url("{{ url_for('static', filename='logo.png') }}") center/contain no-repeat;
      opacity:.08;
      pointer-events:none;
      z-index:0;
    }
    header{
      position:relative;
      z-index:1;
      margin:25px 0 15px;
      text-align:center;
    }
    header h1{
      font-size:32px;
      font-weight:700;
      letter-spacing:-.5px;
      color:var(--azul);
    }
    .grid{
      position:relative;
      z-index:1;
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:20px;
      width:100%;
      max-width:1100px;
      padding:0 20px;
    }
    @media (max-width:900px){.grid{grid-template-columns:repeat(2, 1fr)}}
    @media (max-width:600px){.grid{grid-template-columns:1fr}}
    .card{
      background:var(--tarjeta);
      border-radius:16px;
      padding:20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      box-shadow:0 2px 8px rgba(0,0,0,.08);
      transition:transform .2s;
      border-left: 5px solid var(--azul);
    }
    .card:hover{transform:translateY(-4px)}
    .info h3{font-size:17px;font-weight:600;margin-bottom:4px}
    .info p{color:var(--sub);font-size:15px}
    .cant{font-size:30px;font-weight:700;color:var(--azul);margin-right:14px}
    .btn{
      background:var(--azul);
      color:#fff;
      border:none;
      border-radius:12px;
      width:46px;
      height:46px;
      font-size:26px;
      cursor:pointer;
      transition:background .2s;
    }
    .btn:hover{background:#2980b9}
    #print, #reset, #imprimir-clave{
      position:relative;
      z-index:1;
      margin-top:20px;
      padding:14px 32px;
      font-size:18px;
      font-weight:600;
      border:none;
      border-radius:12px;
      cursor:pointer;
      transition:background .2s;
    }
    #print{background:var(--success);color:#fff}
    #reset{background:var(--danger);color:#fff}
    #imprimir-clave{background:var(--azul);color:#fff}
    .clave-box{
      position:relative;
      z-index:1;
      margin-top:12px;
      display:flex;
      gap:8px;
      justify-content:center;
      flex-wrap:wrap;
    }
    input[type=password]{
      padding:8px 12px;
      border:1px solid #ccc;
      border-radius:8px;
      width:160px;
    }
    .evento-info {
      position:relative;
      z-index:1;
      background:var(--azul);
      color:white;
      padding:10px 20px;
      border-radius:12px;
      margin-bottom:20px;
      text-align:center;
      max-width:1100px;
      width:100%;
    }
  </style>
</head>
<body>

<header>
  <h1>EVENTO ANTARES</h1>
</header>

<div class="evento-info">
  <p>Centro de Convenciones ANTARES - Festival 2024</p>
</div>

<section class="grid">
  {% for p in items %}
  <div class="card">
    <div class="info">
      <h3>{{ p.nombre }}</h3>
      <p>S/ {{ "%.2f"|format(p.precio) }}</p>
    </div>
    <div style="display:flex;align-items:center">
      <span class="cant" id="cant-{{ p.sku }}">{{ p.cant }}</span>
      <button class="btn" onclick="add('{{ p.sku }}')">+</button>
    </div>
  </div>
  {% endfor %}
</section>

<button id="print" onclick="imprimir()">🖨 Imprimir Todo</button>

<div class="clave-box">
  <input id="clave-reset" type="password" placeholder="Clave reset">
  <button id="reset" onclick="resetear()">🔒 Resetear</button>
</div>

<div class="clave-box">
  <input id="clave-total" type="password" placeholder="Clave imprimir">
  <button id="imprimir-clave" onclick="imprimirTotalClave()">🔒 Imprimir Total</button>
</div>

<div style="position:relative;z-index:1;margin-top:25px;background:#fff;border-radius:12px;padding:15px 25px;box-shadow:0 2px 8px rgba(0,0,0,.08);border-top:5px solid var(--azul)">
  <h2 style="margin:0;font-size:20px">Total del día</h2>
  <div style="font-size:28px;font-weight:700;color:var(--azul)">S/ {{ "%.2f"|format(total) }}</div>
</div>

<script>
const CLAVE_RESET = "1012";
const CLAVE_TOTAL  = "1012";

async function add(sku){
  const res = await fetch("/add",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sku})});
  const data = await res.json();
  document.getElementById('cant-'+sku).textContent = data.cant;
  location.reload(); // actualiza total
}
async function resetear(){
  if(document.getElementById('clave-reset').value !== CLAVE_RESET){alert("Clave incorrecta");return;}
  if(!confirm("¿Seguro de resetear todo?"))return;
  await fetch("/reset",{method:"POST"});
  location.reload();
}
async function imprimirTotalClave(){
  if(document.getElementById('clave-total').value !== CLAVE_TOTAL){alert("Clave incorrecta");return;}
  await fetch("/imprimir",{method:"POST"});
  alert("Total impreso (2 copias)");
}
</script>

</body>
</html>
